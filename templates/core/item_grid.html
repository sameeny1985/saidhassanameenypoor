<div class="card-grid">

    {% for item in items %}

        <article class="work-card">

            {% if item.image_url %}

                <a class="card-image"
                   href="{{ item.url }}"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img
                        src="{{ item.image_url }}"
                        alt=""
                        loading="lazy"
                    >

                </a>

            {% else %}

                <div class="card-image card-placeholder">

                    <span>
                        SA<span class="accent">.</span>
                    </span>

                </div>

            {% endif %}


            <div class="card-body">

                <div class="card-meta">

                    <span>FEATURED LINK</span>

                    <span>↗</span>

                </div>


                <h3>
                    {{ item.title }}
                </h3>


                {% if item.description %}

                    <p>
                        {{ item.description }}
                    </p>

                {% endif %}


                <a
                    class="text-link"
                    href="{{ item.url }}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    Visit link

                    <span>↗</span>

                </a>

            </div>

        </article>

    {% empty %}

        <div class="empty-state">

            {{ empty }}

        </div>

    {% endfor %}

</div>
