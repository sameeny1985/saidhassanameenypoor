{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#090b12">

    <title>
        {% block title %}
        Said Hassan Ameeny Poor | Software Developer & Programmer
        {% endblock %}
    </title>

    <meta name="description"
          content="{% block meta_description %}Official website of Said Hassan Ameeny Poor, Software Developer and Programmer. Explore projects, articles, websites and videos.{% endblock %}">

    <meta name="robots"
          content="{% block robots %}index, follow, max-image-preview:large{% endblock %}">

    <link rel="canonical"
          href="https://saidhassanameenypoor.onrender.com{{ request.path }}">

    <!-- Open Graph -->

    <meta property="og:type" content="website">

    <meta property="og:title"
          content="Said Hassan Ameeny Poor | Software Developer">

    <meta property="og:description"
          content="Official personal portfolio of Said Hassan Ameeny Poor. Software Developer and Programmer.">

    <meta property="og:url"
          content="https://saidhassanameenypoor.onrender.com{{ request.path }}">

    <meta property="og:image"
          content="https://saidhassanameenypoor.onrender.com/static/images/said-profile.jpg">

    <meta property="og:site_name"
          content="Said Hassan Ameeny Poor">

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Said Hassan Ameeny Poor | Software Developer">

    <meta name="twitter:description"
          content="Personal portfolio, software projects, articles and websites.">

    <meta name="twitter:image"
          content="https://saidhassanameenypoor.onrender.com/static/images/said-profile.jpg">

    <!-- Google Search Console verification -->

    <!-- Add your Google verification meta tag here when provided -->

    <link rel="stylesheet"
          href="{% static 'css/site.css' %}">

    <link rel="icon"
          href="{% static 'images/said-profile.jpg' %}"
          type="image/jpeg">

    {% block structured_data %}{% endblock %}

</head>

<body>

    <div class="ambient ambient-one"></div>

    <div class="ambient ambient-two"></div>

    <header class="topbar wrap">

        <a class="brand" href="/">
            SA<span>.</span>
        </a>

        <nav>

            <a href="/#articles">Articles</a>

            <a href="/#websites">Websites</a>

            <a href="/#videos">Videos</a>

            <a href="/#telegram">Telegram</a>

        </nav>

    </header>

    <main>

        {% block content %}{% endblock %}

    </main>

    <footer class="footer wrap">

        <span>
            © {% now "Y" %} Said Hassan Ameeny Poor
        </span>

        <span>
            Software Developer & Programmer
        </span>

    </footer>

</body>

</html>
