databases:
  - name: said-portfolio-db
    plan: free
    databaseName: said_portfolio
    user: said_portfolio

services:
  - type: web
    name: said-hassan-portfolio
    runtime: python
    plan: free

    buildCommand: "./build.sh"

    startCommand: "gunicorn config.wsgi:application"

    healthCheckPath: "/health/"

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: said-portfolio-db
          property: connectionString

      - key: SITE_URL
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false
